name: Publish

# Releases are published to PyPI with Trusted Publishing (OIDC): no API
# token is stored anywhere. PyPI is configured to trust this repository's
# `publish.yml` workflow running in the `pypi` environment.
#
#   PyPI    - published automatically when a GitHub Release is published
#   TestPyPI - run this workflow manually to rehearse a release first
#
# The same arrangement as mock-sap, mock-edi and mock-bank (docs/GITHUB.md).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Against the released mocks, which is what somebody installing this
      # release will have. `tests/__init__.py` starts them.
      - name: Run the test suite before releasing anything
        run: |
          python -m pip install -e ".[test]"
          python -m unittest discover -s tests -t . -v
          PAYMENT_RUN_FORMAT=nacha python -m unittest -v tests.test_payment_run
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The tag, pyproject.toml and the built package must agree
        run: |
          set -eu
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install dist/*.whl
          BUILT=$(cd /tmp && /tmp/wheel/bin/python -c "import mockacme; print(mockacme.__version__)")
          echo "pyproject=$VERSION built=$BUILT tag=${GITHUB_REF_NAME#v}"
          test "$BUILT" = "$VERSION"
          if [ "${{ github.event_name }}" = "release" ]; then
            test "${GITHUB_REF_NAME#v}" = "$VERSION"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*

  pypi:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mock-acme
    permissions:
      id-token: write        # the OIDC token that stands in for an API token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mock-acme
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
