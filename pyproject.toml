[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-acme"
version = "0.5.0"
description = "The integration between the mocks: the middleware that mock-sap, mock-edi, mock-bank and mock-einvoice exist to test. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["sap", "edi", "x12", "iso20022", "procure-to-pay", "reconciliation",
            "integration", "middleware", "mock", "testing", "e-invoicing", "peppol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Testing",
]
# The package talks to the mocks over HTTP and imports none of them, so it
# needs nothing. The tests need all four running: see `test` below.
dependencies = []

[project.optional-dependencies]
# mock-sap 0.19.0 is a real floor: it is the first that reads what a credit on
# a statement says it is, and `payment_run` relies on that to post money
# arriving with its reference. The other two carry no floor anyone has found.
test = ["mock-sap>=0.19.0", "mock-edi>=0.9.0", "mock-bank", "mock-einvoice"]

[project.urls]
Repository = "https://github.com/rseufert/mock-acme"
Issues = "https://github.com/rseufert/mock-acme/issues"
Changelog = "https://github.com/rseufert/mock-acme/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["mockacme"]
